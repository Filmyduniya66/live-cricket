<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Player</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.10.0/video-js.min.css" rel="stylesheet" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        .video-js { width: 100% !important; height: 100vh !important; }
    </style>
</head>
<body>

    <video id="live-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto"></video>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.10.0/video.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.4/dash.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-contrib-dash/5.1.1/videojs-contrib-dash.min.js"></script>

    <script>
        // URL se ?id= value nikalne ke liye function
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        const streamId = getQueryParam('id');
        const player = videojs('live-player');

        if (streamId) {
            // NOTE: Yahan apne streaming server ka base URL dalein jo ID ko accept kare.
            // Example ke liye agar aapka main source kisi server pe hai:
            let streamUrl = "https://yourserver.com/live/" + streamId + "https://sonydaimenew.akamaized.net/hls/live/2037142/cricodi0906/ENG/std_lrh-800300010.m3u8?hdnea=exp=1781019854~acl=/*~id=91241173209101006577261130083446~hmac=b033ce4897344435258868072d265643f9d276fb04a416d0c055e726272cbf1c"; 
            let streamType = "application/x-mpegURL"; // M3U8 ke liye

            // Agar MPD chalana hai toh type ko "application/dash+xml" aur extension .mpd karein

            player.src({ src: streamUrl, type: streamType });
            player.play().catch(error => console.log("Autoplay block hua:", error));
        } else {
            alert("Error: Video ID missing hai!");
        }
    </script>
</body>
</html>
