<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Player</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.10.0/video-js.min.css" rel="stylesheet" />
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        .video-js { width: 100% !important; height: 100vh !important; }
    </style>
</head>
<body>

    <video id="live-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto"></video>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.10.0/video.min.js"></script>

    <script>
        // URL से ?id= वैल्यू निकालने के लिए फ़ंक्शन
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        const streamId = getQueryParam('id');
        const player = videojs('live-player');

        if (streamId) {
            // URL को ठीक किया गया है (अगर आप डायनामिक ID डालना चाहते हैं तो इस URL को बदल सकते हैं)
            let streamUrl = "https://sonydaimenew.akamaized.net/hls/live/2037142/cricodi0906/ENG/std_lrh-800300010.m3u8?hdnea=exp=1781019854~acl=/*~id=91241173209101006577261130083446~hmac=b033ce4897344435258868072d265643f9d276fb04a416d0c055e726272cbf1c"; 
            
            // HLS (.m3u8) के लिए सही MIME Type
            let streamType = "application/x-mpegURL"; 

            player.src({ src: streamUrl, type: streamType });
            
            // ब्राउज़र की Autoplay पॉलिसी के कारण म्यूट करके प्ले करना सुरक्षित रहता है
            player.ready(function() {
                player.muted(true); // पहले म्यूट करें ताकि ऑटोप्ले ब्लॉक न हो
                player.play().catch(error => {
                    console.log("Autoplay ब्लॉक हुआ, यूज़र को प्ले बटन दबाना होगा:", error);
                });
            });

        } else {
            alert("Error: Video ID missing है! URL में ?id=something जोड़ें।");
        }
    </script>
</body>
</html>
